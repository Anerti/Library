openapi: 3.0.3
info:
  title: Library Management API
  description: |
    Library management API — manages books, copies, authors, genres,
    arrivals (stock receipts) and sales within one or more libraries.

    Based on the project's conceptual data model (MCD).
  version: 0.1.0
  contact:
    name: API Support
    email: support@library.app

servers:
  - url: https://api.library.app/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

components:

  schemas:
    # ────────────────── Enums ──────────────────
    BookCopyFormat:
      type: string
      enum:
        - HARDCOVER
        - PAPERBACK
        - POCKET
      description: Physical format of a book copy

    BookCopyStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD_OUT
      description: Availability status of a book copy

    SaleStatus:
      type: string
      enum:
        - SOLD
        - BOOKED
        - EXPIRED
      description: Status of a sale

    # ────────────────── Authentication ──────────────────
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - confirmPassword
        - firstName
        - lastName
        - birthDate
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: mySecureP@ss1
        confirmPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: mySecureP@ss1
        firstName:
          type: string
          maxLength: 100
          example: Faly
        lastName:
          type: string
          maxLength: 100
          example: Randria
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        password:
          type: string
          format: password
          example: mySecureP@ss1

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          type: object
          required:
            - email
            - firstName
            - lastName
            - birthDate
          properties:
            email:
              type: string
              format: email
              example: faly.randria@email.com
            firstName:
              type: string
              maxLength: 100
              example: Faly
            lastName:
              type: string
              maxLength: 100
              example: Randria
            birthDate:
              type: string
              format: date
              example: "1995-08-12"
            phone:
              type: string
              maxLength: 30
              nullable: true
              example: +261 32 11 234 56

    # ────────────────── Library ──────────────────
    LibraryRequest:
      type: object
      required:
        - name
        - phone
        - email
        - address
      properties:
        name:
          type: string
          maxLength: 100
          example: Librairie Générale
        phone:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@librairie-generale.mg
        address:
          type: string
          maxLength: 100
          example: 15 Avenue de l'Indépendance, Antananarivo

    LibraryResponse:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - address
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          maxLength: 100
          example: Librairie Générale
        phone:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@librairie-generale.mg
        address:
          type: string
          maxLength: 100
          example: 15 Avenue de l'Indépendance, Antananarivo

    LibraryUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
          example: Librairie Générale
        phone:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@librairie-generale.mg
        address:
          type: string
          maxLength: 100
          example: 15 Avenue de l'Indépendance, Antananarivo

    # ────────────────── Book ──────────────────
    BookRequest:
      type: object
      required:
        - title
        - isbn
        - publisher
        - publishedAt
      properties:
        title:
          type: string
          maxLength: 100
          example: Le Petit Prince
        summary:
          type: string
          nullable: true
          example: Les aventures d'un petit garçon venu d'ailleurs...
        isbn:
          type: string
          maxLength: 100
          example: 978-2-07-061275-8
        publisher:
          type: string
          maxLength: 100
          example: Gallimard
        publishedAt:
          type: string
          format: date
          example: "1943-04-06"

    BookResponse:
      type: object
      required:
        - id
        - title
        - isbn
        - publisher
        - publishedAt
        - createdAt
        - authors
        - genres
      properties:
        id:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        title:
          type: string
          maxLength: 100
          example: Le Petit Prince
        summary:
          type: string
          nullable: true
          example: Les aventures d'un petit garçon venu d'ailleurs...
        isbn:
          type: string
          maxLength: 100
          example: 978-2-07-061275-8
        publisher:
          type: string
          maxLength: 100
          example: Gallimard
        publishedAt:
          type: string
          format: date
          example: "1943-04-06"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorResponse'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreSummary'

    BookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 100
          example: Le Petit Prince
        summary:
          type: string
          nullable: true
          example: Les aventures d'un petit garçon venu d'ailleurs...
        isbn:
          type: string
          maxLength: 100
          example: 978-2-07-061275-8
        publisher:
          type: string
          maxLength: 100
          example: Gallimard
        publishedAt:
          type: string
          format: date
          example: "1943-04-06"

    # ────────────────── Author ──────────────────
    AuthorRequest:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          maxLength: 100
          example: Antoine
        lastName:
          type: string
          maxLength: 100
          example: de Saint-Exupéry

    AuthorResponse:
      type: object
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: string
          format: uuid
          example: c1d2e3f4-a5b6-7890-abcd-ef1234567890
        firstName:
          type: string
          maxLength: 100
          example: Antoine
        lastName:
          type: string
          maxLength: 100
          example: de Saint-Exupéry

    AuthorUpdateRequest:
      type: object
      minProperties: 1
      properties:
        firstName:
          type: string
          maxLength: 100
          example: Antoine
        lastName:
          type: string
          maxLength: 100
          example: de Saint-Exupéry

    # ────────────────── Genre ──────────────────
    GenreRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Fiction

    GenreResponse:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        name:
          type: string
          maxLength: 100
          example: Fiction
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    GenreSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        name:
          type: string
          maxLength: 100
          example: Fiction

    GenreUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
          example: Fiction

    # ────────────────── User ──────────────────
    UserRequest:
      type: object
      required:
        - lastName
        - birthDate
        - email
      properties:
        lastName:
          type: string
          maxLength: 100
          example: Randria
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Faly
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56

    UserResponse:
      type: object
      required:
        - id
        - lastName
        - birthDate
        - email
        - role
        - updatedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: e1f2a3b4-c5d6-7890-abcd-ef1234567890
        lastName:
          type: string
          maxLength: 100
          example: Randria
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Faly
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56
        role:
          type: string
          enum: [ADMIN, CUSTOMER]
          description: User role (discriminator)
          example: CUSTOMER
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        lastName:
          type: string
          maxLength: 100
          example: Randria
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Faly
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56

    # ────────────────── Book Copy ──────────────────
    BookCopyRequest:
      type: object
      required:
        - price
        - format
        - bookId
        - libraryId
        - pageNumber
      properties:
        price:
          type: number
          format: double
          example: 25.00
          description: Unit sale price
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        libraryId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        pageNumber:
          type: integer
          example: 120

    BookCopyResponse:
      type: object
      required:
        - id
        - price
        - format
        - libraryId
        - bookId
        - status
        - pageNumber
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        price:
          type: number
          format: double
          example: 25.00
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        libraryId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/BookCopyStatus'
        pageNumber:
          type: integer
          example: 120
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    BookCopyUpdateRequest:
      type: object
      minProperties: 1
      properties:
        price:
          type: number
          format: double
          example: 25.00
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        status:
          $ref: '#/components/schemas/BookCopyStatus'
        pageNumber:
          type: integer
          example: 120

    # ────────────────── Arrival ──────────────────
    ArrivalRequest:
      type: object
      properties:
        arrivalDate:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
          description: Reception date. Defaults to the current date.

    ArrivalResponse:
      type: object
      required:
        - id
        - createdAt
        - arrivalDate
        - libraryId
      properties:
        id:
          type: string
          format: uuid
          example: a2b3c4d5-e6f7-8901-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
        arrivalDate:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
        libraryId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    # ────────────────── Arrival Item (arrival_book_copy) ──────────────────
    ArrivalItemRequest:
      type: object
      required:
        - bookCopyId
        - purchasePrice
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        purchasePrice:
          type: number
          format: double
          example: 15.00
          description: Unit purchase price (supplier cost)
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 3

    ArrivalItemResponse:
      type: object
      required:
        - bookCopyId
        - arrivalId
        - createdAt
        - purchasePrice
        - quantity
        - updatedAt
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        arrivalId:
          type: string
          format: uuid
          example: a2b3c4d5-e6f7-8901-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
        purchasePrice:
          type: number
          format: double
          example: 15.00
        quantity:
          type: integer
          example: 3
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"

    # ────────────────── Sale ──────────────────
    SaleRequest:
      type: object
      required:
        - customer
      properties:
        saleDate:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"
          description: Sale date. Defaults to the current date.
        customer:
          $ref: '#/components/schemas/UserRequest'
        status:
          $ref: '#/components/schemas/SaleStatus'

    SaleResponse:
      type: object
      required:
        - id
        - saleDate
        - customer
        - status
        - library
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-abcd-ef1234567890
        saleDate:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"
        customer:
          $ref: '#/components/schemas/UserResponse'
        status:
          $ref: '#/components/schemas/SaleStatus'
        library:
          $ref: '#/components/schemas/LibraryResponse'
        createdAt:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"

    SaleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/SaleStatus'
        saleDate:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"

    # ────────────────── Sale Item (sale_book_copy) ──────────────────
    SaleItemRequest:
      type: object
      required:
        - bookCopyId
        - price
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        price:
          type: number
          format: double
          example: 25.00
          description: Unit sale price at the time of transaction

    SaleItemResponse:
      type: object
      required:
        - bookCopyId
        - saleId
        - createdAt
        - quantity
        - price
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        saleId:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"
        quantity:
          type: integer
          example: 1
        price:
          type: number
          format: double
          example: 25.00


    # ────────────────── Analytics ──────────────────
    DailyRevenueResponse:
      type: object
      required:
        - date
        - totalRevenue
      properties:
        date:
          type: string
          format: date
          example: "2026-06-06"
        totalRevenue:
          type: number
          format: double
          example: 1250.00

    MonthlyRevenueItem:
      type: object
      required:
        - year
        - month
        - totalRevenue
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: string
          enum:
            - january
            - february
            - march
            - april
            - may
            - june
            - july
            - august
            - september
            - october
            - november
            - december
          example: june
        totalRevenue:
          type: number
          format: double
          example: 4500.00

    RevenueByGenreItem:
      type: object
      required:
        - genreId
        - genreName
        - totalRevenue
        - totalSold
      properties:
        genreId:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        genreName:
          type: string
          example: Fiction
        totalRevenue:
          type: number
          format: double
          example: 2300.00
        totalSold:
          type: integer
          example: 45

    TopBookItem:
      type: object
      required:
        - book
        - totalSold
        - totalRevenue
      properties:
        book:
          $ref: '#/components/schemas/BookResponse'
        totalSold:
          type: integer
          example: 30
        totalRevenue:
          type: number
          format: double
          example: 750.00

    RecentSaleItem:
      type: object
      required:
        - id
        - saleDate
        - customer
        - status
        - totalAmount
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-abcd-ef1234567890
        saleDate:
          type: string
          format: date-time
          example: "2026-06-06T14:30:00Z"
        customer:
          $ref: '#/components/schemas/UserResponse'
        status:
          $ref: '#/components/schemas/SaleStatus'
        totalAmount:
          type: number
          format: double
          example: 75.00

    BookStockResponse:
      type: object
      required:
        - bookId
        - total
      properties:
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        total:
          type: integer
          example: 200
        byFormat:
          type: string
          nullable: true
          enum:
            - HARDCOVER
            - PAPERBACK
            - POCKET
          description: Format used for filtering, null when no format filter was applied
          example: POCKET

    # ────────────────── Pagination ──────────────────
    Pagination:
      type: object
      required:
        - page
        - size
        - total
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          example: 42

    # ────────────────── Shared error ──────────────────
    Error:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field affected by the error
              message:
                type: string
                description: Error description for this field

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /auth/login or POST /auth/register

  responses:
    BadRequest:
      description: Malformed request or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            message: The request body contains invalid JSON or a parameter is malformed

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            error: Not Found
            message: The requested resource was not found

    Unprocessable:
      description: Semantically invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 422
            error: Unprocessable Entity
            message: At least one required field is missing or invalid

    Conflict:
      description: Resource conflict (e.g. duplicate unique field)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 409
            error: Conflict
            message: ISBN 978-2-07-036002-4 already exists.

    Unauthorized:
      description: Authentication failed or missing/invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            error: Unauthorized
            message: Invalid or expired JWT token

    Forbidden:
      description: Authenticated but insufficient permissions (requires ADMIN role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            error: Forbidden
            message: Admin access required


paths:

  # ═══════════════════════ Authentication ═══════════════════════
  /auth/register:
    post:
      operationId: register
      summary: Create a new user account
      description: Register a new user with email and password. Returns a JWT token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':

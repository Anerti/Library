  # ═══════════════════════ Analytics ═══════════════════════

  /libraries/{libraryId}/analytics/revenue/today:
    get:
      operationId: getDailyRevenue
      summary: Daily revenue
      description: Total revenue from completed sales today for a library
      tags:
        - Analytics
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: Daily revenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRevenueResponse'
              example:
                date: "2026-06-06"
                totalRevenue: 1250.00
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryId}/analytics/revenue/monthly:
    get:
      operationId: getMonthlyRevenue
      summary: Monthly revenue
      description: Total revenue for a given month in a library
      tags:
        - Analytics
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
          description: Year (defaults to current year)
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
          description: Month (1-12, defaults to current month)
      responses:
        '200':
          description: Monthly revenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyRevenueItem'
              example:
                year: 2026
                month: june
                totalRevenue: 4500.00
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryId}/analytics/revenue/by-genre:
    get:
      operationId: getRevenueByGenre
      summary: Revenue by genre
      description: Total revenue grouped by genre for a library, with pagination and sorting
      tags:
        - Analytics
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date (inclusive)
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort by totalRevenue (ascending or descending)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: Revenue grouped by genre (paginated)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevenueByGenreItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - genreId: d1e2f3a4-b5c6-7890-abcd-ef1234567890
                    genreName: Fiction
                    totalRevenue: 2300.00
                    totalSold: 45
                  - genreId: e2f3a4b5-c6d7-8901-abcd-ef1234567891
                    genreName: Science-Fiction
                    totalRevenue: 1500.00
                    totalSold: 28
                pagination:
                  page: 1
                  size: 20
                  total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'


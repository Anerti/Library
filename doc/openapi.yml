openapi: 3.0.3
info:
  title: Library Management API
  description: |
    API de gestion de bibliothèque — gère les livres, exemplaires, auteurs, genres,
    arrivages (réceptions de stock) et ventes au sein d'une ou plusieurs librairies.

    Basée sur le MCD conceptuel du projet.
  version: 0.1.0
  contact:
    name: API Support
    email: support@library.app

servers:
  - url: https://api.library.app/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

components:

  schemas:
    # ────────────────── Enums ──────────────────
    BookCopyFormat:
      type: string
      enum:
        - HARDCOVER
        - PAPERBACK
        - POCKET
      description: Format physique d'un exemplaire

    BookCopyStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD_OUT
      description: Disponibilité d'un exemplaire

    SaleStatus:
      type: string
      enum:
        - SOLD
        - BOOKED
        - EXPIRED
      description: État d'une vente

    # ────────────────── Library ──────────────────
    LibraryRequest:
      type: object
      required:
        - name
        - phone
        - email
        - address
      properties:
        name:
          type: string
          maxLength: 100
          example: Librairie Générale
        phone:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@librairie-generale.mg
        address:
          type: string
          maxLength: 100
          example: 15 Avenue de l'Indépendance, Antananarivo

    LibraryResponse:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - address
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          maxLength: 100
          example: Librairie Générale
        phone:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@librairie-generale.mg
        address:
          type: string
          maxLength: 100
          example: 15 Avenue de l'Indépendance, Antananarivo

    LibraryUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
          example: Librairie Générale
        phone:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@librairie-generale.mg
        address:
          type: string
          maxLength: 100
          example: 15 Avenue de l'Indépendance, Antananarivo

    # ────────────────── Book ──────────────────
    BookRequest:
      type: object
      required:
        - title
        - isbn
        - publisher
        - publishedAt
      properties:
        title:
          type: string
          maxLength: 100
          example: Le Petit Prince
        abstract:
          type: string
          nullable: true
          example: Les aventures d'un petit garçon venu d'ailleurs...
        isbn:
          type: string
          maxLength: 100
          example: 978-2-07-061275-8
        publisher:
          type: string
          maxLength: 100
          example: Gallimard
        publishedAt:
          type: string
          format: date
          example: "1943-04-06"

    BookResponse:
      type: object
      required:
        - id
        - title
        - isbn
        - publisher
        - publishedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        title:
          type: string
          maxLength: 100
          example: Le Petit Prince
        abstract:
          type: string
          nullable: true
          example: Les aventures d'un petit garçon venu d'ailleurs...
        isbn:
          type: string
          maxLength: 100
          example: 978-2-07-061275-8
        publisher:
          type: string
          maxLength: 100
          example: Gallimard
        publishedAt:
          type: string
          format: date
          example: "1943-04-06"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    BookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 100
          example: Le Petit Prince
        abstract:
          type: string
          nullable: true
          example: Les aventures d'un petit garçon venu d'ailleurs...
        isbn:
          type: string
          maxLength: 100
          example: 978-2-07-061275-8
        publisher:
          type: string
          maxLength: 100
          example: Gallimard
        publishedAt:
          type: string
          format: date
          example: "1943-04-06"

    # ────────────────── Author ──────────────────
    AuthorRequest:
      type: object
      required:
        - lastName
      properties:
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Antoine
        lastName:
          type: string
          maxLength: 100
          example: de Saint-Exupéry

    AuthorResponse:
      type: object
      required:
        - id
        - lastName
      properties:
        id:
          type: string
          format: uuid
          example: c1d2e3f4-a5b6-7890-abcd-ef1234567890
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Antoine
        lastName:
          type: string
          maxLength: 100
          example: de Saint-Exupéry

    AuthorUpdateRequest:
      type: object
      minProperties: 1
      properties:
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Antoine
        lastName:
          type: string
          maxLength: 100
          example: de Saint-Exupéry

    # ────────────────── Genre ──────────────────
    GenreRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Fiction

    GenreResponse:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        name:
          type: string
          maxLength: 100
          example: Fiction
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    GenreUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
          example: Fiction

    # ────────────────── Customer ──────────────────
    CustomerRequest:
      type: object
      required:
        - lastName
        - birthDate
        - email
        - password
      properties:
        lastName:
          type: string
          maxLength: 100
          example: Randria
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Faly
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        password:
          type: string
          maxLength: 255
          writeOnly: true
          example: "********"
          description: Mot de passe en clair (sera hashé côté serveur)
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56

    CustomerResponse:
      type: object
      required:
        - id
        - lastName
        - birthDate
        - email
        - updatedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: e1f2a3b4-c5d6-7890-abcd-ef1234567890
        lastName:
          type: string
          maxLength: 100
          example: Randria
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Faly
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    CustomerUpdateRequest:
      type: object
      minProperties: 1
      properties:
        lastName:
          type: string
          maxLength: 100
          example: Randria
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: Faly
        birthDate:
          type: string
          format: date
          example: "1995-08-12"
        email:
          type: string
          format: email
          maxLength: 100
          example: faly.randria@email.com
        phone:
          type: string
          maxLength: 30
          nullable: true
          example: +261 32 11 234 56

    # ────────────────── Book Copy ──────────────────
    BookCopyRequest:
      type: object
      required:
        - price
        - format
        - bookId
        - pageNumber
      properties:
        price:
          type: number
          format: double
          example: 25.00
          description: Prix de vente unitaire
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        pageNumber:
          type: integer
          example: 120

    BookCopyResponse:
      type: object
      required:
        - id
        - price
        - format
        - libraryId
        - bookId
        - status
        - pageNumber
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        price:
          type: number
          format: double
          example: 25.00
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        libraryId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/BookCopyStatus'
        pageNumber:
          type: integer
          example: 120
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    BookCopyUpdateRequest:
      type: object
      minProperties: 1
      properties:
        price:
          type: number
          format: double
          example: 25.00
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        status:
          $ref: '#/components/schemas/BookCopyStatus'
        pageNumber:
          type: integer
          example: 120

    # ────────────────── Arrival ──────────────────
    ArrivalRequest:
      type: object
      properties:
        arrivalDate:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
          description: Date de réception. Par défaut, la date courante.

    ArrivalResponse:
      type: object
      required:
        - id
        - createdAt
        - arrivalDate
        - libraryId
      properties:
        id:
          type: string
          format: uuid
          example: a2b3c4d5-e6f7-8901-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
        arrivalDate:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
        libraryId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    # ────────────────── Arrival Item (arrival_book_copy) ──────────────────
    ArrivalItemRequest:
      type: object
      required:
        - bookCopyId
        - purchasePrice
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        purchasePrice:
          type: number
          format: double
          example: 15.00
          description: Prix d'achat unitaire (coût fournisseur)
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 3

    ArrivalItemResponse:
      type: object
      required:
        - bookCopyId
        - arrivalId
        - createdAt
        - purchasePrice
        - quantity
        - updatedAt
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        arrivalId:
          type: string
          format: uuid
          example: a2b3c4d5-e6f7-8901-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"
        purchasePrice:
          type: number
          format: double
          example: 15.00
        quantity:
          type: integer
          example: 3
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T08:00:00Z"

    # ────────────────── Sale ──────────────────
    SaleRequest:
      type: object
      required:
        - customerId
      properties:
        saleDate:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"
          description: Date de la vente. Par défaut, la date courante.
        customerId:
          type: string
          format: uuid
          example: e1f2a3b4-c5d6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/SaleStatus'

    SaleResponse:
      type: object
      required:
        - id
        - saleDate
        - customerId
        - status
        - libraryId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-abcd-ef1234567890
        saleDate:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"
        customerId:
          type: string
          format: uuid
          example: e1f2a3b4-c5d6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/SaleStatus'
        libraryId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"

    SaleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/SaleStatus'
        saleDate:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"

    # ────────────────── Sale Item (sale_book_copy) ──────────────────
    SaleItemRequest:
      type: object
      required:
        - bookCopyId
        - price
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        price:
          type: number
          format: double
          example: 25.00
          description: Prix unitaire de vente au moment de la transaction

    SaleItemResponse:
      type: object
      required:
        - bookCopyId
        - saleId
        - createdAt
        - quantity
        - price
      properties:
        bookCopyId:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        saleId:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-15T14:30:00Z"
        quantity:
          type: integer
          example: 1
        price:
          type: number
          format: double
          example: 25.00

    # ────────────────── Book-Author Association ──────────────────
    BookAuthorResponse:
      type: object
      required:
        - bookId
        - authorId
      properties:
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        authorId:
          type: string
          format: uuid
          example: c1d2e3f4-a5b6-7890-abcd-ef1234567890

    # ────────────────── Book-Genre Association ──────────────────
    BookGenreResponse:
      type: object
      required:
        - bookId
        - genreId
        - createdAt
        - updatedAt
      properties:
        bookId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-abcd-ef1234567890
        genreId:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00Z"

    # ────────────────── Analytics ──────────────────
    DailyRevenueResponse:
      type: object
      required:
        - date
        - totalRevenue
      properties:
        date:
          type: string
          format: date
          example: "2026-06-06"
        totalRevenue:
          type: number
          format: double
          example: 1250.00

    MonthlyRevenueItem:
      type: object
      required:
        - year
        - month
        - totalRevenue
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: string
          enum:
            - janvier
            - février
            - mars
            - avril
            - mai
            - juin
            - juillet
            - août
            - septembre
            - octobre
            - novembre
            - décembre
          example: juin
        totalRevenue:
          type: number
          format: double
          example: 4500.00

    RevenueByGenreItem:
      type: object
      required:
        - genreId
        - genreName
        - totalRevenue
        - totalSold
      properties:
        genreId:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        genreName:
          type: string
          example: Fiction
        totalRevenue:
          type: number
          format: double
          example: 2300.00
        totalSold:
          type: integer
          example: 45

    TopBookItem:
      type: object
      required:
        - book
        - totalSold
        - totalRevenue
      properties:
        book:
          $ref: '#/components/schemas/BookResponse'
        totalSold:
          type: integer
          example: 30
        totalRevenue:
          type: number
          format: double
          example: 750.00

    RecentSaleItem:
      type: object
      required:
        - id
        - saleDate
        - customer
        - status
        - totalAmount
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-abcd-ef1234567890
        saleDate:
          type: string
          format: date-time
          example: "2026-06-06T14:30:00Z"
        customer:
          $ref: '#/components/schemas/CustomerResponse'
        status:
          $ref: '#/components/schemas/SaleStatus'
        totalAmount:
          type: number
          format: double
          example: 75.00

    StockResponse:
      type: object
      required:
        - totalCopies
        - availableCopies
        - soldOutCopies
      properties:
        totalCopies:
          type: integer
          example: 200
        availableCopies:
          type: integer
          example: 150
        soldOutCopies:
          type: integer
          example: 50
        byFormat:
          type: array
          items:
            type: object
            required:
              - format
              - total
              - available
            properties:
              format:
                $ref: '#/components/schemas/BookCopyFormat'
              total:
                type: integer
                example: 80
              available:
                type: integer
                example: 60

    # ────────────────── Pagination ──────────────────
    Pagination:
      type: object
      required:
        - page
        - size
        - total
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          example: 42

    # ────────────────── Shared error ──────────────────
    Error:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          description: Code HTTP
        error:
          type: string
          description: Libellé de l'erreur
        message:
          type: string
          description: Message explicatif
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Champ concerné par l'erreur
              message:
                type: string
                description: Description de l'erreur sur ce champ

  responses:
    BadRequest:
      description: Requête malformée ou paramètres invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            message: The request body contains invalid JSON or a parameter is malformed

    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            error: Not Found
            message: The requested resource was not found

    Unprocessable:
      description: Données sémantiquement invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 422
            error: Unprocessable Entity
            message: At least one required field is missing or invalid


paths:
  # ═══════════════════════ Libraries ═══════════════════════
  /libraries:
    get:
      operationId: listLibraries
      summary: List all libraries
      tags:
        - Libraries
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Free-text search on name, email, or address
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: Paginated list of libraries
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LibraryResponse'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  -
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    name: Librairie Générale
                    phone: +261 34 12 345 67
                    email: contact@librairie-generale.mg
                    address: "15 Avenue de l'Indépendance, Antananarivo"
                pagination:
                  page: 1
                  size: 20
                  total: 1

        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      operationId: createLibrary
      summary: Create a new library
      tags:
        - Libraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryRequest'
      responses:
        '201':
          description: Library created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                name: Librairie Générale
                phone: +261 34 12 345 67
                email: contact@librairie-generale.mg
                address: "15 Avenue de l'Indépendance, Antananarivo"

        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'


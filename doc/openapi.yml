      responses:
        '200':
          description: Revenue du jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRevenueResponse'
              example:
                date: "2026-06-06"
                totalRevenue: 1250.00
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryId}/analytics/revenue/monthly:
    get:
      operationId: getMonthlyRevenue
      summary: Revenue mensuel
      description: Chiffre d'affaires total pour un mois donné dans une librairie
      tags:
        - Analytics
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
          description: Année (par défaut l'année courante)
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
          description: Mois (1-12, par défaut le mois courant)
      responses:
        '200':
          description: Revenue du mois
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyRevenueItem'
              example:
                year: 2026
                month: juin
                totalRevenue: 4500.00
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/{libraryId}/analytics/revenue/by-genre:
    get:
      operationId: getRevenueByGenre
      summary: Revenue par genre
      description: Chiffre d'affaires total groupé par genre pour une librairie, avec pagination et tri
      tags:
        - Analytics
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Date de début (inclusive)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Date de fin (inclusive)
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Tri par totalRevenue (ascendant ou descendant)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: Revenue groupé par genre (pagíné)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevenueByGenreItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - genreId: d1e2f3a4-b5c6-7890-abcd-ef1234567890
                    genreName: Fiction
                    totalRevenue: 2300.00
                    totalSold: 45
                  - genreId: e2f3a4b5-c6d7-8901-abcd-ef1234567891
                    genreName: Science-Fiction
                    totalRevenue: 1500.00
                    totalSold: 28
                pagination:
                  page: 1
                  size: 20
                  total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

